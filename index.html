<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08030d">
<title>Love Me? ❤️</title>
<style>
  :root { --pink:#ff2da6; --hot:#ff4db8; --white:#fff5fc; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; min-height:100dvh; overflow:hidden;
    display:grid; place-items:center; color:var(--white);
    font-family: ui-rounded, "Trebuchet MS", Arial, sans-serif;
    background: radial-gradient(ellipse at 50% 45%, #210923 0%, #0d0612 48%, #030205 100%);
  }
  #stars { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
  .card {
    position:relative; z-index:1; width:min(940px, 100%); min-height:100dvh;
    padding:clamp(22px, 5vh, 58px) 20px 26px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }
  h1 {
    font-size:clamp(2rem, 7vw, 4.4rem); line-height:1.1; margin:0 0 12px;
    color:#fff1fa; text-shadow:0 0 10px #ff2da6, 0 0 32px #ff2da688;
  }
  .subtitle { color:#e9b9da; font-size:clamp(.95rem, 2.8vw, 1.15rem); margin:0 0 16px; }
  .tiny-heart { color:var(--pink); display:inline-block; animation:pulse 1.2s infinite; }
  .buttons { position:relative; width:min(380px, 92vw); height:68px; margin:10px auto 0; }
  button {
    border:1px solid #ff5bbd; border-radius:15px; padding:14px 24px;
    min-width:124px; font-size:1.1rem; font-weight:700; cursor:pointer;
    color:white; background:#190d20; box-shadow:0 0 15px #ff2da633;
    -webkit-tap-highlight-color:transparent;
  }
  #yes { background:linear-gradient(135deg,#ff168e,#ff4db8); border-color:#ff9bd5;
    box-shadow:0 0 24px #ff2da677; }
  #no { position:absolute; left:calc(50% + 16px); top:0; transition:left .14s ease, top .14s ease; }
  #yes { position:absolute; left:calc(50% - 140px); top:0; }
  .tease { height:28px; margin:8px 0 0; color:#ff80d0; font-size:.95rem; }
  #result { display:none; width:100%; animation:appear .8s ease both; }
  #result h2 { margin:4px 0 0; font-size:clamp(1.6rem, 6vw, 3rem); color:#ff69c5;
    text-shadow:0 0 20px #ff2da688; }
  #result p { color:#f5c9e7; margin:8px 0 0; font-size:clamp(1rem, 3vw, 1.2rem); }
  #heartCanvas { width:min(410px, 88vw); height:min(340px, 38vh); display:block; margin:0 auto; }
  .again { margin-top:20px; font-size:.9rem; min-width:auto; padding:10px 18px; }
  .float-heart { position:fixed; bottom:-40px; z-index:2; pointer-events:none; animation:floatUp linear forwards; }
  @keyframes pulse { 50% { transform:scale(1.22); } }
  @keyframes appear { from {opacity:0; transform:translateY(12px) scale(.96)} to {opacity:1;transform:none} }
  @keyframes floatUp { to { transform:translateY(-115vh) rotate(35deg); opacity:0; } }
  @media (max-width:420px) {
    .card { padding-left:12px; padding-right:12px; }
    button { min-width:112px; padding:13px 16px; }
    #yes { left:calc(50% - 128px); }
    #no { left:calc(50% + 12px); }
  }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<main class="card">
  <section id="questionPanel">
    <h1>Do you love me? <span class="tiny-heart">♥</span></h1>
    <p class="subtitle">Be honest… </p>
    <div class="buttons" id="buttonArea">
      <button id="yes" type="button">Yes ♥</button>
      <button id="no" type="button">No </button>
    </div>
    <p class="tease" id="tease" aria-live="polite"></p>
  </section>

  <section id="result">
    <canvas id="heartCanvas" aria-label="A rainbow heart being drawn"></canvas>
    <h2>I LOVE YOU, DEEMA ♥</h2>
    <p>You just made my whole world brighter ✨</p>
    <button class="again" id="again" type="button">Watch it again ↻</button>
  </section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const no = $('no'), yes = $('yes'), area = $('buttonArea'), tease = $('tease');
  let noCount = 0, finished = false;

  function moveNo() {
    if (finished) return;
    noCount++;
    const areaRect = area.getBoundingClientRect();
    const maxX = Math.max(0, areaRect.width - no.offsetWidth);
    const maxY = 12;
    no.style.left = Math.random() * maxX + 'px';
    no.style.top = (Math.random() * maxY) + 'px';
    no.style.transform = `rotate(${Math.random()*18-9}deg)`;
    tease.textContent = ['Hehe, try again 😜','Too slow! 💨','Nope, not today 💗','You can’t catch me!'][Math.min(noCount-1,3)];
  }
  no.addEventListener('pointerenter', moveNo);
  no.addEventListener('touchstart', e => { e.preventDefault(); moveNo(); }, {passive:false});
  no.addEventListener('click', e => { e.preventDefault(); moveNo(); });

  const starCanvas = $('stars'), starCtx = starCanvas.getContext('2d');
  let stars = [];
  function sizeStars() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    starCanvas.width = innerWidth*dpr; starCanvas.height = innerHeight*dpr;
    starCtx.setTransform(dpr,0,0,dpr,0,0);
    stars = Array.from({length:Math.min(110, Math.floor(innerWidth*innerHeight/8500))}, () => ({
      x:Math.random()*innerWidth, y:Math.random()*innerHeight,
      r:Math.random()*1.6+.3, a:Math.random()*.7+.2, phase:Math.random()*6
    }));
    drawStars();
  }
  function drawStars() {
    starCtx.clearRect(0,0,innerWidth,innerHeight);
    const t = Date.now()/900;
    for (const s of stars) {
      starCtx.globalAlpha = s.a*(.65+.35*Math.sin(t+s.phase));
      starCtx.fillStyle = '#ff9ddd'; starCtx.beginPath();
      starCtx.arc(s.x,s.y,s.r,0,Math.PI*2); starCtx.fill();
    }
    starCtx.globalAlpha=1; requestAnimationFrame(drawStars);
  }
  addEventListener('resize', sizeStars); sizeStars();

  const hc = $('heartCanvas'), ctx = hc.getContext('2d');
  let animationId;
  function heartPoint(t, scale) {
    return { x: 16*Math.pow(Math.sin(t),3)*scale,
      y: -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*scale };
  }
  function drawHeart() {
    cancelAnimationFrame(animationId);
    const rect = hc.getBoundingClientRect(), dpr = Math.min(devicePixelRatio||1,2);
    hc.width = Math.max(1, rect.width*dpr); hc.height = Math.max(1,rect.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const w=rect.width, h=rect.height, scale=Math.min(w/37,h/34)*.88;
    const cx=w/2, cy=h/2+2, total=300;
    let frame=0;
    function render() {
      ctx.clearRect(0,0,w,h);
      // A luminous rainbow heart, drawn gradually with colorful star tips.
      const progress=Math.min(1,frame/total);
      const points=Math.max(2,Math.floor(progress*420));
      for(let i=1;i<points;i++) {
        const t0=(i-1)/420*Math.PI*2, t1=i/420*Math.PI*2;
        const p0=heartPoint(t0,scale), p1=heartPoint(t1,scale);
        const hue=(i/420*360+frame*.45)%360;
        ctx.beginPath(); ctx.moveTo(cx+p0.x,cy+p0.y); ctx.lineTo(cx+p1.x,cy+p1.y);
        ctx.strokeStyle=`hsl(${hue},100%,65%)`; ctx.lineWidth=2.2;
        ctx.shadowColor=ctx.strokeStyle; ctx.shadowBlur=9; ctx.stroke(); ctx.shadowBlur=0;
      }
      for(let i=0;i<points;i+=7) {
        const t=i/420*Math.PI*2, p=heartPoint(t,scale);
        ctx.fillStyle=`hsl(${(i/420*360+frame*.45)%360},100%,70%)`;
        ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=8;
        ctx.font='12px Arial'; ctx.fillText('✦',cx+p.x-4,cy+p.y+4); ctx.shadowBlur=0;
      }
      if(frame<total) { frame+=2; animationId=requestAnimationFrame(render); }
      else { ctx.save(); ctx.globalAlpha=.18; ctx.fillStyle='#ff3fac'; ctx.beginPath(); ctx.arc(cx,cy,Math.min(w,h)*.43,0,Math.PI*2); ctx.fill(); ctx.restore(); }
    }
    render();
  }
  function showerHearts() {
    const symbols=['♥','♡','✦','💗','✨'];
    for(let i=0;i<28;i++) {
      const el=document.createElement('span'); el.className='float-heart';
      el.textContent=symbols[Math.floor(Math.random()*symbols.length)];
      el.style.left=Math.random()*100+'vw';
      el.style.color=['#ff45b5','#ff9ddd','#ffffff','#d85cff'][Math.floor(Math.random()*4)];
      el.style.fontSize=(18+Math.random()*22)+'px';
      el.style.animationDuration=(3+Math.random()*3)+'s';
      document.body.appendChild(el); setTimeout(()=>el.remove(),6500);
    }
  }
  function accept() {
    if(finished) return; finished=true;
    $('questionPanel').style.display='none';
    $('result').style.display='block';
    drawHeart(); showerHearts();
  }
  yes.addEventListener('click', accept);
  $('again').addEventListener('click', () => { drawHeart(); showerHearts(); });
})();
</script>
</body>
</html>
